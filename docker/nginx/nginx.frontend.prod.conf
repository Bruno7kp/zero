server {
    listen 80;
    server_name _;

    # Diretório com build Vite copiado no estágio final
    root /usr/share/nginx/html;
    index index.html;

    # Se quiser proxy para backend no mesmo domínio:
    location /api/ {
        proxy_pass http://backend:9000/api/; # Ajuste se usar outro host/reverse proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Suporte a roteamento client-side (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeçalhos básicos de segurança (ajuste conforme necessidade)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
