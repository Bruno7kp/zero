server {
    listen 80;
    server_name _;

    root /var/www/html/public; # contém index.php Laravel + pasta spa/
    # Priorizar SPA para / (index.html primeiro)
    index index.html index.php;

    # Service Worker (referenciado como /registerSW.js, arquivo fica em /spa/)
    location = /registerSW.js {
        try_files /spa/registerSW.js =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Ícone raiz servido da SPA
    location = /zero-icon.png {
        try_files /spa/zero-icon.png =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Assets da SPA (hashes Vite) servidos diretamente via alias
    location /assets/ {
        alias /var/www/html/public/spa/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Static SPA fallback (frontend build em public/spa)
    # Root: tenta arquivo direto; se não existir, cai para SPA index.html
    location / {
        # Order:
        # 1) Real file in /public
        # 2) Static file produced by Vite in /public/spa (e.g. /zero-icon.png)
        # 3) SPA index.html
        try_files $uri /spa$uri /spa/index.html;
    }

    # Força index.html da SPA a não ser cacheado (garante atualização imediata após deploy)
    location = /spa/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /spa/index.html =404;
    }

    # API Laravel
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP scripts -> php-fpm (container backend:9000)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass backend:9000; # nome do serviço php-fpm no compose
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    # Headers cache para assets versionados (Vite faz hash). Inclui fallback para /spa$uri
    # para casos como /zero-icon.png que vive em /spa/zero-icon.png após build.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri /spa$uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Segurança básica
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
